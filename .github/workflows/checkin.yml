name: 福利吧自动签到

# ============================================
# 触发条件
# ============================================
on:
  schedule:
    # 避开整点调度高峰：早上 00:05 签到 (UTC 16:05 = 北京时间 00:05)
    - cron: '5 16 * * *'
    # 避开整点调度高峰：早上 09:12 复查 (UTC 01:12 = 北京时间 09:12)
    - cron: '12 1 * * *'
  # 支持手动触发（用于测试）
  workflow_dispatch:

# ============================================
# 任务
# ============================================
jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. 拉取代码
      - name: 检出代码
        uses: actions/checkout@v4

      # 2. 设置 Python 环境
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. 安装依赖
      - name: 安装依赖
        run: pip install -r requirements.txt

      # 4. 判断当前是签到还是复查 (需同步修改匹配规则)
      - name: 判断运行模式
        id: mode
        run: |
          SCHEDULE="${{ github.event.schedule }}"
          # 必须与上面的 cron 字符串完全一致，注意空格
          if [ "$SCHEDULE" = "5 16 * * *" ]; then
            echo "mode=checkin" >> $GITHUB_OUTPUT
            echo "当前模式: 早起签到" >> $GITHUB_STEP_SUMMARY
          elif [ "$SCHEDULE" = "12 1 * * *" ]; then
            echo "mode=verify" >> $GITHUB_OUTPUT
            echo "当前模式: 早上复查" >> $GITHUB_STEP_SUMMARY
          else
            echo "mode=checkin" >> $GITHUB_OUTPUT
            echo "当前模式: 手动触发(默认签到)" >> $GITHUB_STEP_SUMMARY
          fi

      # 5. 执行签到脚本
      - name: 执行签到
        env:
          FORUM_COOKIE: ${{ secrets.FORUM_COOKIE }}
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          CHECKIN_MODE: ${{ steps.mode.outputs.mode }}
        run: python checkin.py
