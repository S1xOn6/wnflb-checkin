name: 保持活跃 (Keepalive)

# ============================================
# 触发条件
# ============================================
on:
  schedule:
    # 每月 1 号和 15 号的北京时间中午 12:30 (UTC 04:30) 执行
    # 频率无需太高，足以重置 60 天倒计时即可
    - cron: '30 4 1,15 * *'
  workflow_dispatch:

# ============================================
# 任务
# ============================================
jobs:
  keep-active:
    runs-on: ubuntu-latest
    # 【强制要求】必须显式赋予 GITHUB_TOKEN 代码写入权限，否则无法提交保活 commit
    permissions:
      contents: write 
      
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 运行 Keepalive 动作
        uses: gautamkrishnar/keepalive-workflow@v2
        with:
          # 保持提交记录的整洁，使用空提交（不修改实质文件）
          commit_message: "chore: auto keepalive to prevent workflow suspension"
